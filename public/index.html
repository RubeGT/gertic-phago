<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SketchLink | Tuff Edition</title>
    <style>
        :root { --bg: #0b0e14; --panel: #151921; --accent: #00d2ff; --primary: #3a86ff; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: white; margin: 0; overflow: hidden; }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease forwards; }

        /* Layout */
        .container { display: flex; height: 100vh; }
        #sidebar { width: 300px; background: var(--panel); border-right: 2px solid #222; padding: 25px; transition: 0.3s; }
        #main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }

        /* Landing/Lobby UI */
        .card { background: var(--panel); padding: 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; }
        input { background: #1b202b; border: 2px solid #2d3446; color: white; padding: 15px; border-radius: 12px; width: 280px; font-size: 18px; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--accent); }
        button { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; margin: 10px; }
        button:hover { transform: scale(1.05); filter: brightness(1.2); }
        button:active { transform: scale(0.95); }

        /* Drawing Canvas (BIGGER) */
        #canvas-container { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 0 40px rgba(0,210,255,0.2); position: relative; }
        canvas { cursor: crosshair; touch-action: none; display: block; }

        /* Album Reveal */
        #album-reveal { position: absolute; inset: 0; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .reveal-card { max-width: 800px; width: 90%; text-align: center; }
        .reveal-img { max-width: 100%; border-radius: 20px; border: 4px solid white; box-shadow: 0 15px 40px rgba(0,0,0,0.6); display: none; }
        .reveal-text { font-size: 48px; font-weight: 900; color: var(--accent); margin: 20px 0; display: none; }
    </style>
</head>
<body>

<div class="container" id="game-container" style="display:none;">
    <div id="sidebar">
        <h1 style="color:var(--accent)">SketchLink</h1>
        <p>Room ID: <b id="room-id-display"></b></p>
        <div id="player-list"></div>
        <button id="host-start" style="display:none; width:100%" onclick="playClick(); socket.emit('start-game', currentRoom)">Start Game</button>
    </div>
    <div id="main">
        <h2 id="status-msg" class="fade-in">Waiting for host...</h2>
        
        <div id="ui-prompt" style="display:none" class="fade-in">
            <input type="text" id="p-input" placeholder="Enter a wild prompt...">
            <button onclick="playClick(); submitPrompt()">Send It</button>
        </div>

        <div id="ui-draw" style="display:none" class="fade-in">
            <div id="canvas-container">
                <canvas id="canvas" width="900" height="550"></canvas>
            </div>
            <button onclick="playClick(); ctx.clearRect(0,0,900,550)">Clear</button>
            <button onclick="playClick(); submitDrawing()" style="background:#00f5d4; color:#000">Done!</button>
        </div>
    </div>
</div>

<div id="landing" class="main" style="height:100vh; display:flex; align-items:center; justify-content:center;">
    <div class="card fade-in">
        <h1 style="font-size:3rem; margin-bottom:10px">SketchLink</h1>
        <p style="opacity:0.6">Multiplayer Drawing Mayhem</p>
        <input type="text" id="username" placeholder="Nickname"><br>
        <button onclick="playClick(); host()">Host Game</button>
        <button onclick="playClick(); join()" style="background:#2d3446">Join Room</button>
        <br><input type="text" id="joinCode" placeholder="Room ID" style="width:150px; margin-top:10px; font-size:14px;">
    </div>
</div>

<div id="album-reveal">
    <div class="reveal-card">
        <div id="reveal-user" style="font-size:20px; opacity:0.5"></div>
        <div id="reveal-text" class="reveal-text"></div>
        <img id="reveal-img" class="reveal-img">
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let currentRoom = null;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let painting = false;

    // --- AUDIO SYSTEM ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playClick() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    // --- GAME LOGIC ---
    function host() {
        const name = document.getElementById('username').value;
        if(name) socket.emit('create-room', name);
    }

    function join() {
        const name = document.getElementById('username').value;
        const code = document.getElementById('joinCode').value;
        if(name && code) socket.emit('join-room', { roomId: code, username: name });
    }

    socket.on('room-joined', (data) => {
        currentRoom = data.roomId;
        document.getElementById('landing').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        document.getElementById('room-id-display').innerText = data.roomId;
    });

    socket.on('update-players', (players) => {
        document.getElementById('player-list').innerHTML = players.map(p => `<div class="fade-in" style="margin-bottom:8px">• ${p.name}</div>`).join('');
        const me = players.find(p => p.id === socket.id);
        if(me?.isHost) document.getElementById('host-start').style.display = 'block';
    });

    socket.on('change-phase', (data) => {
        document.getElementById('status-msg').innerText = data.msg;
        document.getElementById('ui-prompt').style.display = data.phase === 'PROMPT' ? 'block' : 'none';
        document.getElementById('ui-draw').style.display = data.phase === 'DRAW' ? 'block' : 'none';
        if(data.phase === 'RESULTS') startReveal(data.album);
    });

    function submitPrompt() {
        const val = document.getElementById('p-input').value;
        socket.emit('submit-data', { roomId: currentRoom, data: val, type: 'PROMPT' });
        document.getElementById('ui-prompt').style.display = 'none';
        document.getElementById('status-msg').innerText = "Waiting for others...";
    }

    function submitDrawing() {
        socket.emit('submit-data', { roomId: currentRoom, data: canvas.toDataURL(), type: 'IMAGE' });
        document.getElementById('ui-draw').style.display = 'none';
        document.getElementById('status-msg').innerText = "Waiting for others...";
    }

    // --- SMOOTH DRAWING (Tablet Optimized) ---
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.addEventListener('pointerdown', (e) => { painting = true; ctx.beginPath(); });
    canvas.addEventListener('pointerup', () => painting = false);
    canvas.addEventListener('pointermove', (e) => {
        if (!painting) return;
        const pos = getPos(e);
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#000';
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    });

    // --- TUFF REVEAL SYSTEM ---
    async function startReveal(album) {
        document.getElementById('album-reveal').style.display = 'flex';
        const txt = document.getElementById('reveal-text');
        const img = document.getElementById('reveal-img');
        const user = document.getElementById('reveal-user');

        for (let item of album) {
            user.innerText = `${item.user}'s contribution:`;
            user.style.display = 'block';
            
            if (item.type === 'PROMPT') {
                txt.innerText = item.content;
                txt.style.display = 'block';
                img.style.display = 'none';
                txt.classList.add('fade-in');
            } else {
                img.src = item.content;
                img.style.display = 'block';
                txt.style.display = 'none';
                img.classList.add('fade-in');
            }
            
            // Wait for dramatic effect
            await new Promise(r => setTimeout(r, 3000));
            txt.classList.remove('fade-in');
            img.classList.remove('fade-in');
        }
        
        user.innerText = "Game Over!";
        setTimeout(() => location.reload(), 5000);
    }
</script>
</body>
</html>

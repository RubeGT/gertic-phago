<!DOCTYPE html>
<html>
<head>
    <title>Railway Gartic Clone</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #2c3e50; color: white; }
        canvas { background: white; border: 5px solid #bdc3c7; border-radius: 10px; cursor: crosshair; margin-top: 20px; }
        .ui-panel { background: #34495e; padding: 20px; border-radius: 10px; display: inline-block; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Sketch Chain</h1>
    <div id="setup">
        <input type="text" id="nameInput" placeholder="Enter Username">
        <button onclick="join()">Join Game</button>
    </div>

    <div id="game-area" style="display:none;">
        <h3 id="instruction">Draw something!</h3>
        <canvas id="canvas" width="500" height="400"></canvas><br>
        <button onclick="submit()">Finish Drawing</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        function join() {
            const name = document.getElementById('nameInput').value;
            if(!name) return alert("Enter a name!");
            socket.emit('join-game', name);
            document.getElementById('setup').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
        }

        // Canvas Drawing Logic
        canvas.addEventListener('mousedown', () => drawing = true);
        canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
        canvas.addEventListener('mousemove', (e) => {
            if (!drawing) return;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000';
            ctx.lineTo(e.clientX - canvas.offsetLeft, e.clientY - canvas.offsetTop);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - canvas.offsetLeft, e.clientY - canvas.offsetTop);
        });

        function submit() {
            const data = canvas.toDataURL();
            socket.emit('submit-drawing', { image: data });
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('instruction').innerText = "Waiting for next turn...";
        }

        socket.on('new-task', (data) => {
            if(data.type === 'guess') {
                document.getElementById('instruction').innerText = "Someone sent you this! What is it?";
                // You could display the image in an <img> tag here
            }
        });
    </script>
</body>
</html>
